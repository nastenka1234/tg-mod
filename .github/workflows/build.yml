name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Install exact SDK parts
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          NDK=$(grep -rhE "^[[:space:]]*ndkVersion" --include=build.gradle . | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          BT=$(grep -rhE "^[[:space:]]*buildToolsVersion" --include=build.gradle . | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -1)
          SDK=$(grep -rhE "^[[:space:]]*compileSdk(Version)?[[:space:]]" --include=build.gradle . | grep -oE "[0-9]+" | head -1)
          NDK=${NDK:-21.4.7075529}
          BT=${BT:-36.0.0}
          SDK=${SDK:-36}
          echo "NDK=$NDK BT=$BT SDK=$SDK"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-$SDK" "build-tools;$BT" "ndk;$NDK" "cmake;3.10.2.4988404"
      - name: Gradle settings
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleAfatRelease --no-daemon --stacktrace -Pandroid.injected.testOnly=false
      - name: Check testOnly
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          for f in $(find . -name "*.apk" | grep -v Tests); do
            echo "== $f"
            if $ANDROID_HOME/build-tools/$BT/aapt2 dump badging "$f" | grep -qi testOnly; then
              echo "TESTONLY FOUND in $f"
              exit 1
            fi
          done
          echo "no testOnly"
      - name: Sign APK
        run: |
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          TOOLS=$ANDROID_HOME/build-tools/$BT
          keytool -genkeypair -keystore mod.jks -alias mod -keyalg RSA -keysize 2048 -validity 10000 -storepass modpass123 -keypass modpass123 -dname "CN=mod"
          mkdir -p signed
          for f in $(find . -name "*.apk" -not -path "./signed/*" | grep -v Tests); do
            n=$(echo "$f" | sed 's#^\./##' | tr '/' '_')
            $TOOLS/zipalign -f -p 4 "$f" "signed/al_$n"
            $TOOLS/apksigner sign --ks mod.jks --ks-pass pass:modpass123 --key-pass pass:modpass123 --out "signed/$n" "signed/al_$n"
            rm "signed/al_$n"
          done
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: apk-signed
          path: signed/*.apk
          if-no-files-found: error
